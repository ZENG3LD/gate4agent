[package]
name = "gate4agent"
version = "0.4.8"
edition = "2021"
description = "Transport library for CLI AI agents — first tier: Claude Code, Codex, Kimi, Grok. Pipe, PTY, ACP (Agent Client Protocol), and Daemon transports."
license = "MIT"
repository = "https://github.com/ZENG3LD/gate4agent"
readme = "README.md"
keywords = ["claude", "agent", "cli", "pipe", "pty"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
gate4agent-types = { path = "crates/gate4agent-types", version = "0.4.8" }
gate4agent-catalog = { path = "crates/gate4agent-catalog", version = "0.4.8" }

# PTY creation and cross-platform ConPTY support (in-house: ConPTY on
# Windows, posix_openpt/fork+exec on unix; std-only, no external deps)
gate4agent-pty = { path = "crates/gate4agent-pty", version = "0.4.8" }

# ANSI escape sequence stripping (VteParser)
vte = "0.13"

# Full virtual terminal screen emulation (ScreenParser, PTY mirror mode)
vt100 = "0.16"

# Async runtime + broadcast channel (required for PtySession and PipeSession)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "process", "macros"] }

# Serialization for AgentEvent, CliTool, etc.
serde = { version = "1", features = ["derive"] }

# UUID for InstanceId
uuid = { version = "1", features = ["v4", "serde"] }

# NDJSON parsing
serde_json = "1"

# Timestamps in RateLimitInfo
chrono = { version = "0.4", features = ["serde"] }

# PtyError, AgentError
thiserror = "2"

# RateLimitDetector patterns, OutputParser regex matching
regex = "1"

# HTTP client for live OpenRouter model fetch (optional, behind cure-network feature)
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = []
# Enable live model discovery via https://openrouter.ai/api/v1/models.
# Adds reqwest as a dependency. Without it, cure() always falls through to
# the Hardcoded marker (no live source to try).
cure-network = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Internal workspace; independent from any parent workspace.
[workspace]
members = [
    "crates/g4a",
    "crates/gate4agent-types",
    "crates/gate4agent-adapters",
    "crates/gate4agent-provider-ports",
    "crates/gate4agent-catalog",
    "crates/gate4agent-engine",
    "crates/gate4agent-tool-protocol",
    "crates/gate4agent-tool-engine",
    "crates/gate4agent-kernel",
    "crates/gate4agent-handle",
    "crates/gate4agent-shell-history",
    "crates/gate4agent-shell-capabilities",
    "crates/gate4agent-shell-one-shot",
    "crates/gate4agent-shell-native",
    "crates/gate4agent-runtime-native",
    "crates/gate4agent-testkit",
    "crates/gate4agent-pty",
    "crates/gate4agent-build-stamp",
    "crates/gate4agent-node-protocol",
    "crates/gate4agent-node-wire",
    "crates/gate4agent-node",
    "crates/gate4agent-c2-protocol",
    "crates/gate4agent-c2-client",
    "crates/gate4agent-c2",
    "crates/gate4agent-bidi-relay",
]
resolver = "2"
