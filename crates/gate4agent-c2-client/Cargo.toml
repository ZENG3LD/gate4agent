[package]
name = "gate4agent-c2-client"
version = "0.4.1"
edition = "2021"
description = "Typed client library and CLI (gate4agent-c2ctl) for the gate4agent C2 control and observer APIs"
license = "MIT"

[lib]
name = "gate4agent_c2_client"

[dependencies]
gate4agent-c2-protocol = { path = "../gate4agent-c2-protocol", version = "0.4.1" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol", version = "0.4.1" }
gate4agent-node-wire = { path = "../gate4agent-node-wire", version = "0.4.1" }
gate4agent-types = { path = "../gate4agent-types", version = "0.4.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
