[package]
name = "gate4agent-c2-protocol"
version = "0.4.3"
edition = "2021"
description = "Stable, serde-only inventory and control wire contract for gate4agent C2 relays and clients"
license = "MIT"

[lib]
name = "gate4agent_c2_protocol"

[dependencies]
gate4agent-build-stamp = { path = "../gate4agent-build-stamp", version = "0.4.3" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol", version = "0.4.3" }
gate4agent-types = { path = "../gate4agent-types", version = "0.4.3" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
