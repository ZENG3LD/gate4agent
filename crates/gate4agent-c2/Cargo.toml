[package]
name = "gate4agent-c2"
version = "0.4.7"
edition = "2021"
description = "Relay daemon that aggregates gate4agent node state/events and routes commands down to attached nodes"
license = "MIT"

[lib]
name = "gate4agent_c2"

[[bin]]
name = "gate4agent-c2"
path = "src/main.rs"

[dependencies]
gate4agent-c2-protocol = { path = "../gate4agent-c2-protocol", version = "0.4.7" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol", version = "0.4.7" }
gate4agent-node-wire = { path = "../gate4agent-node-wire", version = "0.4.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gate4agent-c2-client = { path = "../gate4agent-c2-client", version = "0.4.7" }
gate4agent-catalog = { path = "../gate4agent-catalog", version = "0.4.7" }
gate4agent-node = { path = "../gate4agent-node", features = ["fixture"], version = "0.4.7" }
gate4agent-runtime-native = { path = "../gate4agent-runtime-native", version = "0.4.7" }
gate4agent-testkit = { path = "../gate4agent-testkit", version = "0.4.7" }
gate4agent-types = { path = "../gate4agent-types", version = "0.4.7" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
vt100 = "0.16"
