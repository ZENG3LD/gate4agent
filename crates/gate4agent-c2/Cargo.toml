[package]
name = "gate4agent-c2"
version = "0.2.37"
edition = "2021"
publish = false

[lib]
name = "gate4agent_c2"

[[bin]]
name = "gate4agent-c2"
path = "src/main.rs"

[dependencies]
gate4agent-c2-protocol = { path = "../gate4agent-c2-protocol" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol" }
gate4agent-node-wire = { path = "../gate4agent-node-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
gate4agent-c2-client = { path = "../gate4agent-c2-client" }
gate4agent-catalog = { path = "../gate4agent-catalog" }
gate4agent-node = { path = "../gate4agent-node", features = ["fixture"] }
gate4agent-runtime-native = { path = "../gate4agent-runtime-native" }
gate4agent-observation-api = { path = "../gate4agent-observation-api" }
gate4agent-observation-engine = { path = "../gate4agent-observation-engine" }
gate4agent-observation-service = { path = "../gate4agent-observation-service" }
gate4agent-testkit = { path = "../gate4agent-testkit" }
gate4agent-types = { path = "../gate4agent-types" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
vt100 = "0.16"
