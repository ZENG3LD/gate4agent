[package]
name = "gate4agent-harness-client"
version = "0.2.37"
edition = "2021"
description = "Typed localhost client and CLI (gate4agent-harnessctl) for the gate4agent harness read and operator hosts"
publish = false

[lib]
name = "gate4agent_harness_client"

[dependencies]
gate4agent-harness-api = { path = "../gate4agent-harness-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
