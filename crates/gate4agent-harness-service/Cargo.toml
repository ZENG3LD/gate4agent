[package]
name = "gate4agent-harness-service"
version = "0.2.37"
edition = "2021"
description = "Single-writer SQLite authority and operator host for the gate4agent harness kernel (bin gate4agent-harness)"
publish = false

[lib]
name = "gate4agent_harness_service"

[dependencies]
gate4agent-c2-client = { path = "../gate4agent-c2-client" }
gate4agent-c2-protocol = { path = "../gate4agent-c2-protocol" }
gate4agent-harness-api = { path = "../gate4agent-harness-api" }
gate4agent-harness-engine = { path = "../gate4agent-harness-engine" }
gate4agent-harness-delivery = { path = "../gate4agent-harness-delivery" }
gate4agent-harness-protocol = { path = "../gate4agent-harness-protocol" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol" }
gate4agent-node-wire = { path = "../gate4agent-node-wire" }
gate4agent-observation-api = { path = "../gate4agent-observation-api" }
gate4agent-observation-engine = { path = "../gate4agent-observation-engine" }
gate4agent-observation-protocol = { path = "../gate4agent-observation-protocol" }
gate4agent-observation-service = { path = "../gate4agent-observation-service" }
gate4agent-types = { path = "../gate4agent-types" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gate4agent-c2 = { path = "../gate4agent-c2" }
gate4agent-harness-client = { path = "../gate4agent-harness-client" }
gate4agent-node = { path = "../gate4agent-node", features = ["fixture"] }
ring = "=0.17.14"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
