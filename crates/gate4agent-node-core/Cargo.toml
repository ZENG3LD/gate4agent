[package]
name = "gate4agent-node-core"
version = "0.4.8"
edition = "2021"
description = "Transport core of the gate4agent node: platform endpoints, spawn profiles, kernel WireGuard bring-up"
license = "MIT"

[lib]
name = "gate4agent_node_core"

[dependencies]
gate4agent-node-protocol = { path = "../gate4agent-node-protocol", version = "0.4.8" }
gate4agent-types = { path = "../gate4agent-types", version = "0.4.8" }
gate4agent-runtime-native = { path = "../gate4agent-runtime-native", version = "0.4.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Kernel WireGuard for node<->C2 (calls `ip link` / `wg`).
wireguard = []
