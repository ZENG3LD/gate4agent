[package]
name = "gate4agent-node-protocol"
version = "0.4.1"
edition = "2021"
description = "Bounded wire contract for the local gate4agent node (inventory, spawn, sessions, worktrees, delivery)"
license = "MIT"

[lib]
name = "gate4agent_node_protocol"

[dependencies]
gate4agent-build-stamp = { path = "../gate4agent-build-stamp", version = "0.4.2" }
gate4agent-types = { path = "../gate4agent-types", version = "0.4.1" }
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "time"] }
