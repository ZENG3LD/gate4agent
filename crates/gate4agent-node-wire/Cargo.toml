[package]
name = "gate4agent-node-wire"
version = "0.4.6"
edition = "2021"
description = "Reusable local wire client, transport, and authentication primitives for gate4agent nodes"
license = "MIT"

[lib]
name = "gate4agent_node_wire"

[dependencies]
gate4agent-node-protocol = { path = "../gate4agent-node-protocol", version = "0.4.6" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ring = "=0.17.14"

[dev-dependencies]
gate4agent-types = { path = "../gate4agent-types", version = "0.4.6" }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread"] }

[features]
default = ["mesh-underlay"]
# Tip-5 Linux-first underlay slice (UDP+AEAD + token barrier). Disable to omit.
mesh-underlay = []
fixture = []
