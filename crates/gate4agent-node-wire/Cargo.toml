[package]
name = "gate4agent-node-wire"
version = "0.2.37"
edition = "2021"
publish = false

[lib]
name = "gate4agent_node_wire"

[dependencies]
gate4agent-node-protocol = { path = "../gate4agent-node-protocol" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ring = "=0.17.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt"] }

[features]
default = []
fixture = []
