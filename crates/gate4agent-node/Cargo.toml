[package]
name = "gate4agent-node"
version = "0.2.37"
edition = "2021"
description = "Native gate4agent node server: wraps providers and owns PTY/inline sessions, the file browser, local git, and worktrees for its machine"
publish = false

[lib]
name = "gate4agent_node"

[[bin]]
name = "gate4agent-node"
path = "src/main.rs"

[dependencies]
gate4agent-catalog = { path = "../gate4agent-catalog" }
gate4agent-handle = { path = "../gate4agent-handle" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol" }
gate4agent-node-wire = { path = "../gate4agent-node-wire" }
gate4agent-runtime-native = { path = "../gate4agent-runtime-native" }
gate4agent-testkit = { path = "../gate4agent-testkit", optional = true }
gate4agent-types = { path = "../gate4agent-types" }
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
default = []
fixture = ["dep:gate4agent-testkit", "gate4agent-node-wire/fixture"]

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
