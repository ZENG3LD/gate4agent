[package]
name = "gate4agent-node"
version = "0.4.8"
edition = "2021"
description = "Native gate4agent node server: wraps providers and owns PTY/inline sessions, the file browser, local git, and worktrees for its machine"
license = "MIT"

[lib]
name = "gate4agent_node"

[[bin]]
name = "gate4agent-node"
path = "src/main.rs"

[dependencies]
# Standard kit cores. Optional so `--no-default-features --features bare` leaves
# them out. dig2browser and mail4agent are path deps: the published dig2browser
# 0.5.0 is not the node browser machine in this tree (stream machine lives
# here), and crates.io mail4agent 0.1.2 is binary-only. claude/codex session
# restore 0.1.3 are libraries on crates.io. grok/kimi 0.1.3 on crates.io are
# binary-only, so those two are path deps. Nothing here is published.
dig2browser = { path = "../../../dig2browser", version = "0.5.0", optional = true, default-features = false }
mail4agent = { path = "../../../mail4agent", version = "0.1.2", optional = true, default-features = false }
claude-session-restore = { version = "0.1.3", optional = true }
codex-session-restore = { version = "0.1.3", optional = true }
grok-session-restore = { path = "../../../session-restore/crates/grok-session-restore", version = "0.1.3", optional = true }
kimi-session-restore = { path = "../../../session-restore/crates/kimi-session-restore", version = "0.1.3", optional = true }
gate4agent-adapters = { path = "../gate4agent-adapters", version = "0.4.8" }
gate4agent-catalog = { path = "../gate4agent-catalog", version = "0.4.8" }
gate4agent-handle = { path = "../gate4agent-handle", version = "0.4.8" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol", version = "0.4.8" }
gate4agent-node-wire = { path = "../gate4agent-node-wire", version = "0.4.8" }
gate4agent-runtime-native = { path = "../gate4agent-runtime-native", version = "0.4.8" }
gate4agent-testkit = { path = "../gate4agent-testkit", optional = true, version = "0.4.8" }
gate4agent-types = { path = "../gate4agent-types", version = "0.4.8" }
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
# Default node is the standard kit (four cores on).
# `bare` does not subtract features by itself. Strip the cores with:
#   cargo build -p gate4agent-node --no-default-features --features bare
# Enabling `kit` and `bare` together is a build error (see build.rs).
default = ["kit"]
kit = [
    "dep:dig2browser",
    "dep:mail4agent",
    "dep:claude-session-restore",
    "dep:codex-session-restore",
    "dep:grok-session-restore",
    "dep:kimi-session-restore",
    "wireguard",
]
# Kernel WireGuard for node↔C2. Either peer may dial. Not the UDP+ChaCha mesh
# underlay and not open_wireguard_daemon_stub. HQ is not part of this kit.
# The driver may be replaced later; this build calls `ip link` / `wg`.
wireguard = []
# Node with dig2browser, mail4agent, session-restore, and WireGuard OFF.
bare = []
# Optional extra, not core, not default. Hatchery git helpers may be wired
# here later. This feature does not depend on hatchery-tui or any hatchery crate.
hatchery-git = []
fixture = ["dep:gate4agent-testkit", "gate4agent-node-wire/fixture"]
# Cheap dig2browser-station named-pipe path reachability probe + node-local
# exclusive BrowserStationLease. The kit's dig2browser crate dep is separate
# (feature `kit`). Feature off keeps browser_profile_id stub echo.
dig2-station-probe = []

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
