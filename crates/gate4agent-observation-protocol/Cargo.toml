[package]
name = "gate4agent-observation-protocol"
version = "0.2.37"
edition = "2021"
description = "Dependency-light, versioned observation wire contract for gate4agent provider-session monitoring"
publish = false

[lib]
name = "gate4agent_observation_protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
