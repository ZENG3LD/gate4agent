[dependencies]
gate4agent-catalog = { path = "../gate4agent-catalog" }
gate4agent-types = { path = "../gate4agent-types" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
