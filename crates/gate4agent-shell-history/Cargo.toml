[package]
name = "gate4agent-shell-history"
version = "0.4.6"
edition = "2021"
description = "Bounded native filesystem authority for gate4agent history"
license = "MIT"

[dependencies]
gate4agent-adapters = { path = "../gate4agent-adapters", version = "0.4.6" }
gate4agent-provider-ports = { path = "../gate4agent-provider-ports", version = "0.4.6" }
gate4agent-types = { path = "../gate4agent-types", version = "0.4.6" }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
gate4agent-catalog = { path = "../gate4agent-catalog", version = "0.4.6" }
