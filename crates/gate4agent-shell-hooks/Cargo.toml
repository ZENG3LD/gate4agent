[package]
name = "gate4agent-shell-hooks"
version = "0.2.37"
edition = "2021"
publish = false

[dependencies]
gate4agent-adapters = { path = "../gate4agent-adapters" }
gate4agent-handle = { path = "../gate4agent-handle" }
gate4agent-types = { path = "../gate4agent-types" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
