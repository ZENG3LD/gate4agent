[package]
name = "gate4agent-shell-native"
version = "0.2.37"
edition = "2021"
description = "Native effect execution (PTY, pipe, ACP) for gate4agent control-plane sessions"
publish = false

[dependencies]
gate4agent = { path = "../.." }
gate4agent-adapters = { path = "../gate4agent-adapters" }
gate4agent-catalog = { path = "../gate4agent-catalog" }
gate4agent-handle = { path = "../gate4agent-handle" }
gate4agent-shell-one-shot = { path = "../gate4agent-shell-one-shot" }
gate4agent-tool-protocol = { path = "../gate4agent-tool-protocol" }
gate4agent-types = { path = "../gate4agent-types" }
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
gate4agent-kernel = { path = "../gate4agent-kernel" }
gate4agent-testkit = { path = "../gate4agent-testkit" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
