[package]
name = "gate4agent-shell-one-shot"
version = "0.2.37"
edition = "2021"
publish = false

[dependencies]
gate4agent = { path = "../.." }
gate4agent-adapters = { path = "../gate4agent-adapters" }
gate4agent-types = { path = "../gate4agent-types" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
gate4agent-catalog = { path = "../gate4agent-catalog" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
