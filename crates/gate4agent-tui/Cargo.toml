[package]
name = "gate4agent-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal client for gate4agent: gate4agent-tui (harness mode) and gate4agent-tui-light (direct-C2 light mode)"
publish = false

[dependencies]
crossterm = "0.28"
gate4agent-c2-client = { path = "../gate4agent-c2-client" }
gate4agent-c2-protocol = { path = "../gate4agent-c2-protocol" }
gate4agent-harness-client = { path = "../gate4agent-harness-client" }
gate4agent-harness-protocol = { path = "../gate4agent-harness-protocol" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol" }
gate4agent-observation-api = { path = "../gate4agent-observation-api" }
gate4agent-observation-engine = { path = "../gate4agent-observation-engine" }
gate4agent-observation-service = { path = "../gate4agent-observation-service" }
gate4agent-types = { path = "../gate4agent-types" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uzor-tui = "1.5.1"
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "gate4agent_tui"
path = "src/lib.rs"

[[bin]]
name = "gate4agent-tui"
path = "src/main.rs"

[[bin]]
name = "gate4agent-tui-light"
path = "src/bin/gate4agent-tui-light.rs"

[workspace]
