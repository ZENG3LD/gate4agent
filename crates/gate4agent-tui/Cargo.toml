[package]
name = "gate4agent-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal client for gate4agent: both gate4agent-tui and gate4agent-tui-light speak only the harness operator wire -- light hosts gate4agent-harness-light in-process over c2 instead of a durable task kernel"
publish = false

[dependencies]
crossterm = "0.28"
gate4agent-c2-client = { path = "../gate4agent-c2-client" }
gate4agent-c2-protocol = { path = "../gate4agent-c2-protocol" }
gate4agent-harness-client = { path = "../gate4agent-harness-client" }
gate4agent-harness-light = { path = "../gate4agent-harness-light" }
gate4agent-harness-protocol = { path = "../gate4agent-harness-protocol" }
gate4agent-node-protocol = { path = "../gate4agent-node-protocol" }
gate4agent-observation-api = { path = "../gate4agent-observation-api" }
gate4agent-observation-engine = { path = "../gate4agent-observation-engine" }
gate4agent-observation-service = { path = "../gate4agent-observation-service" }
gate4agent-types = { path = "../gate4agent-types" }
icy_sixel = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uzor-text = "1.5.1"
uzor-tui = { version = "1.5.1", features = ["ascii"] }
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "gate4agent_tui"
path = "src/lib.rs"

[[bin]]
name = "gate4agent-tui"
path = "src/main.rs"

[[bin]]
name = "gate4agent-tui-light"
path = "src/bin/gate4agent-tui-light.rs"

[workspace]
