[package]
name = "gate4agent-wake"
version = "0.5.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/gate4agent"
description = "Deliver-turn API for agent sessions over structured channels (codex app-server, claude channel MCP, kimi server, grok ACP leader, routine webhook, hook/inbox/headless-resume) and the hosted-session wake decision. No PTY."

[features]
default = ["all"]
all = ["wake-grok", "wake-claude", "wake-codex", "wake-kimi", "wake-cursor", "wake-routine", "wake-spawn"]
wake-grok = ["dep:tokio", "dep:thiserror", "dep:siphasher", "dep:dunce"]
wake-claude = []
wake-codex = []
wake-kimi = ["dep:tokio", "dep:thiserror"]
wake-cursor = []
wake-routine = []
wake-spawn = []

[[bin]]
name = "g4a-grok-push"
required-features = ["wake-grok"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio = { version = "1", optional = true, features = ["rt", "net", "io-util", "time", "sync", "macros", "process"] }
thiserror = { version = "2", optional = true }
# Pipe-name compatibility with grok's leader transport (pinned: SipHash-1-3 keys, dunce home path).
siphasher = { version = "=1.0.1", optional = true }
dunce = { version = "=1.0.5", optional = true }

[target.'cfg(windows)'.dependencies]
# Job Object so a hard-killed host takes its `kimi acp` children with it.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
